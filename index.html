<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>福岡県の観光名所紹介</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <div class="container">
      <h1 class="main-title">福岡県の観光名所紹介</h1>
      <p class="subtitle">福岡を巡る、魅力あふれる観光名所</p>
      <div class="description">
        <p>福岡県には、歴史を感じられる神社や寺院、</p>
        <p>海や自然を楽しめる場所など、</p>
        <p>さまざまな観光名所があります。</p>
        <p>ここでは、福岡を代表する8つの観光名所を</p>
        <p>写真とともに紹介します。</p>
        <p>気になる場所を見つけて、</p>
        <p>福岡観光の参考にしてみてください。</p>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="spot-list">

      <!-- 1. 福岡タワー -->
      <article class="spot-card">

        </div>
        <div class="spot-info">
          <h2>福岡タワー</h2>
          <a href="./fukuoka tower.html" class="btn-detail">詳しく見る</a>
        </div>
      </article>

          <h2>海の中道海浜公園</h2>
          <a href="#" class="btn-detail">詳しく見る</a>
        </div>

      <!-- 3. 櫛田神社 -->

        </div>

          <a href="#" class="btn-detail">詳しく見る</a>

  <footer>
    <p>&copy; 福岡県の観光名所紹介</p>
